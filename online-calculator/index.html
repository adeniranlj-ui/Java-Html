<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1>Online Calculator</h1>

    <form id="calc-form" class="input-group">
      <input id="a" class="form-control" type="number" step="any" placeholder="Number A" required>
      <select id="op" class="form-select" aria-label="Operator">
        <option value="+">+</option>
        <option value="-">&minus;</option>
        <option value="*">&times;</option>
        <option value="/">&divide;</option>
      </select>
      <input id="b" class="form-control" type="number" step="any" placeholder="Number B" required>
      <button class="btn btn-primary">Calculate</button>
    </form>

    <p id="result" class="mt-3"></p>

    <hr>

    <h2>Credit Score Checker</h2>

    <form id="score-form" class="input-group">
      <input id="credit-score" class="form-control" type="number" min="300" max="850" placeholder="Enter your credit score (300–850)" required>
      <button class="btn btn-primary">Check Score</button>
    </form>

    <p id="rating" class="mt-3"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
