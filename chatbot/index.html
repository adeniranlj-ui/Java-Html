<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Tutor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <main class="container py-4">
    <h1>Web Development Tutor</h1>
    <p>Welcome to the Web Development Tutor! Ask any question about HTML, CSS, or JavaScript.</p>

    <div id="chat" class="card card-body mb-3"></div>

    <form id="ask" class="input-group">
      <input id="question" class="form-control" placeholder="Ask a question..." autocomplete="off" required>
      <button id="send" class="btn btn-primary">Send</button>
    </form>
  </main>

  <!-- env.js defines the API key. It is not committed; copy env.example.js to env.js. -->
  <script src="env.js"></script>
  <script src="script.js"></script>
</body>
</html>
